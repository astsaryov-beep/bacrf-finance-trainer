name: Trainer release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recoverable project state and frozen stable snapshot
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: node tests/project-state-check.mjs
      - name: Verify study bank and finance labs
        run: node tests/release-check.mjs
      - name: Verify content continuity and justified repetition
        run: node tests/content-dedup-check.mjs
      - name: Verify completed methodological review and content fingerprints
        run: node tests/methodical-review-check.mjs
      - name: Verify teacher answer alignment and historical rubric migration
        run: node tests/teacher-review-check.mjs
      - name: Verify bond cash flows and source-gap corrections
        run: node tests/quality-m02-check.mjs
      - name: Verify sensitivities, benchmark bases, holding metrics and Q07 history
        run: node tests/quality-m03-check.mjs
      - name: Verify portfolio money risk, clearing and hedge/carry bases
        run: node tests/quality-m04-check.mjs
      - name: Verify M05 financial models and historical rubrics
        run: node tests/quality-m05-check.mjs
      - name: Verify M06 risk models and earlier M04 prerequisites
        run: node tests/quality-m06-check.mjs
      - name: Verify M07 option profiles and structured cash flows
        run: node tests/quality-m07-check.mjs
      - name: Verify multi-select exam and prior learning evidence
        run: node tests/exam-practice-check.mjs
      - name: Verify conceptual learning and corrected answer keys
        run: node tests/learning-review-check.mjs
      - name: Verify fixed income strategy mathematics
        run: node tests/strategies-check.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-package-lock --no-save playwright-core@1.56.1
      - name: Test desktop and mobile UI
        run: |
          node tests/browser-smoke.mjs
          node tests/learning-review-browser.mjs
          node tests/teacher-review-browser.mjs
          node tests/quality-m03-browser.mjs
          node tests/quality-m04-browser.mjs
          node tests/quality-modules-browser.mjs
          node tests/exam-practice-browser.mjs
      - name: Attach screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-browser-smoke
          path: test-artifacts/
          if-no-files-found: ignore

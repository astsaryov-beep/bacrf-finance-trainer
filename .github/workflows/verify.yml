name: Trainer release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify study bank and finance labs
        run: node tests/release-check.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-package-lock --no-save playwright-core@1.56.1
      - name: Test desktop and mobile UI
        run: node tests/browser-smoke.mjs
      - name: Attach screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-browser-smoke
          path: test-artifacts/
          if-no-files-found: ignore
